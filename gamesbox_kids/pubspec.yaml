name: gamesbox_kids
description: GamesBox Kids app — child-facing screen time controller.
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  # Shared library
  gamesbox_common:
    path: ../gamesbox_common

  # Firebase
  firebase_core: ^4.10.0
  firebase_auth: ^6.5.2
  firebase_database: ^12.4.2

  # QR scanning — Phase 2
  mobile_scanner: ^6.0.0

  # QR display (used in pairing guide shown to kids — optional but included for parity)
  pretty_qr_code: ^3.3.0

  # Secure storage (Phase 4, already declared in common but needed here for direct access)
  flutter_secure_storage: ^10.3.1

  # App detection & launching
  installed_apps: ^2.1.1

  # Usage statistics (screen time monitoring)
  usage_stats: ^1.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
