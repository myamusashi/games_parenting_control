name: gamesbox_parent
description: GamesBox Parent app — parental control dashboard.
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  # Shared library
  gamesbox_common:
    path: ../gamesbox_common

  # Firebase
  firebase_core: ^4.10.0
  firebase_auth: ^6.5.2
  firebase_database: ^12.4.2

  # QR display — Phase 2 (UX-P-01)
  pretty_qr_code: ^3.3.0
  qr_flutter: ^4.1.0

  # Secure storage (Phase 4)
  flutter_secure_storage: ^10.3.1

  # Push notifications (Phase 4)
  # firebase_messaging: ^15.0.0  # uncomment when ready for Phase 4

  # App detection & launching
  installed_apps: ^1.4.1

  # Usage statistics
  usage_stats: ^1.3.1

  # Store share intent handling
  receive_sharing_intent: ^1.8.0
  http: ^1.6.0

  # Crypto (for OtpService — already in common, needed here directly)
  crypto: ^3.0.7
  firebase_messaging: ^16.3.0
  flutter_local_notifications: ^22.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
